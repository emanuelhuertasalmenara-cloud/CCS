<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidadesde Medida en CSS</title>
    <style>
        h1{
            font-size: 2cm;
        }
        #caja{
            background-color: aqua;
            height: 100vh;
            width: 100vw;
        }
        p {
            font-size: 1.5em;
        }
        #titulo { background-color:yellow;
            width: 50%;

        }
    </style>
</head>
<body>
    <div id="caja">
    <div id="titulo">
        Esto es una subcaja
    </div>    
    <h1>Unidadesde Medida en CSS</h1>
    <p>
        A diferencia de html que solo acepta pixeles, en CSS se puede indicar el tamaño de los elementoscon distintas unidades. Por ejemplo: centimetros, milimetros, puntos, pixeles ...
    </p>
    </div>
</body>
</html>
